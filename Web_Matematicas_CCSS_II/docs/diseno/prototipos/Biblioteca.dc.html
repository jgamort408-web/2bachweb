<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Biblioteca de recursos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D4ED8}
</style>
</helmet>
<div style="width: 1280px; min-height: 1240px; box-sizing: border-box; background: #F7F8FC; color: #172033; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.55; display: flex; flex-direction: column;">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 14px 48px; background: #FFFFFF; border-bottom: 1px solid #E2E8F0;">
    <a href="#" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #172033;">
      <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="10" fill="#172033"></rect><path d="M8 27h20M9 27V8" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none"></path><path d="M10 24c4-1 6-12 9-12s4 8 8 8" stroke="#93C5FD" stroke-width="2.8" stroke-linecap="round" fill="none"></path></svg>
      <span style="font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 22px;">Mates CCSS II</span>
    </a>
    <nav aria-label="Principal" style="display: flex; gap: 4px; font-size: 15px; font-weight: 600;">
      <a href="#" style="color: #475569; text-decoration: none; padding: 8px 14px;">Inicio</a>
      <a href="#" style="color: #475569; text-decoration: none; padding: 8px 14px;">Libro</a>
      <a href="#" style="color: #475569; text-decoration: none; padding: 8px 14px;">Practicar</a>
      <a href="#" style="color: #475569; text-decoration: none; padding: 8px 14px;">Juegos</a>
      <a href="#" style="color: #172033; text-decoration: none; padding: 8px 14px; border-radius: 999px; background: #EEF2F7;">Recursos</a>
    </nav>
    <div style="width: 148px;"></div>
  </header>

  <main style="flex-grow: 1; padding: 36px 48px 56px; display: flex; flex-direction: column; gap: 24px;">
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <h1 style="margin: 0; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 44px; letter-spacing: -0.02em;">Exámenes y recursos</h1>
      <p style="margin: 0; font-size: 18px; color: #334155;">24 exámenes revisados, cada uno con su solucionario en PDF.</p>
    </div>
    <label style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 18px; background: #FFFFFF; border: 1.5px solid #CBD5E1; border-radius: 14px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Buscar recursos</span>
      <input placeholder="Busca por tema, contenido o tipo de examen (p. ej. «Bayes», «matriz inversa»)" style="flex: 1; border: 0; outline: none; font: inherit; font-size: 17px; background: transparent; color: #172033;">
    </label>

    <div style="display: flex; gap: 32px; align-items: flex-start;">
      <aside aria-label="Filtros" style="width: 260px; flex-shrink: 0; display: flex; flex-direction: column; gap: 22px;">
        <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px;">
          <legend style="font-weight: 700; margin-bottom: 8px;">Bloque</legend>
          <sc-for list="{{blocks}}" as="b" hint-placeholder-count="3">
            <label style="display: flex; align-items: center; gap: 10px; min-height: 32px;"><input type="checkbox" style="width: 20px; height: 20px;"><span style="width: 10px; height: 10px; border-radius: 50%; background: {{b.color}};"></span>{{b.name}}</label>
          </sc-for>
        </fieldset>
        <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px;">
          <legend style="font-weight: 700; margin-bottom: 8px;">Tipo</legend>
          <sc-for list="{{types}}" as="t" hint-placeholder-count="4">
            <label style="display: flex; align-items: center; gap: 10px; min-height: 32px;"><input type="checkbox" style="width: 20px; height: 20px;">{{t.name}}</label>
          </sc-for>
        </fieldset>
      </aside>

      <section style="flex: 1; display: flex; flex-direction: column; gap: 14px; min-width: 0;">
        <div style="display: flex; align-items: center; justify-content: space-between; font-size: 15px; color: #475569;"><span>Mostrando 8 de 24</span><span>Ordenar: por tema</span></div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px;">
          <sc-for list="{{items}}" as="it" hint-placeholder-count="8">
            <article style="display: flex; flex-direction: column; gap: 12px; padding: 18px 20px; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px;">
              <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                <span style="{{it.chip}}">{{it.topic}}</span>
                <span style="padding: 2px 10px; border-radius: 999px; background: #F1F5F9; color: #475569; font-size: 13px; font-weight: 700;">{{it.kind}}</span>
              </div>
              <h2 style="margin: 0; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 21px;">{{it.title}}</h2>
              <p style="margin: 0; font-size: 15px; color: #475569;">{{it.desc}}</p>
              <div style="display: flex; gap: 10px;">
                <a href="#" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 10px; background: #1D4ED8; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 15px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h9l5 5v15H6zM14 2v6h6"></path></svg>Examen</a>
                <a href="#" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 10px; background: #FFFFFF; border: 1px solid #CBD5E1; color: #172033; text-decoration: none; font-weight: 700; font-size: 15px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="m8 12 3 3 5-6"></path></svg>Soluciones</a>
              </div>
            </article>
          </sc-for>
        </div>
      </section>
    </div>
  </main>
  <footer style="padding: 22px 48px; border-top: 1px solid #E2E8F0; background: #FFFFFF; font-size: 14px; color: #475569;">Mates CCSS II · IES Al-Ándalus</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1240}}'>
class Component extends DCLogic {
renderVals() {
const chip = (bg, fg) => 'padding: 2px 10px; border-radius: 999px; background: ' + bg + '; color: ' + fg + '; font-size: 13px; font-weight: 700;';
const an = chip('#DBEAFE', '#1D4ED8'), al = chip('#FAE8FF', '#86198F'), az = chip('#FFEDD5', '#9A3412');
return {
blocks: [{ name: 'Análisis', color: '#2563EB', count: 6 }, { name: 'Álgebra y decisiones', color: '#A21CAF', count: 7 }, { name: 'Azar y datos', color: '#C2410C', count: 9 }],
types: [{ name: 'Examen de tema', count: 16 }, { name: 'Recuperación', count: 2 }, { name: 'Subida de nota', count: 2 }, { name: 'Repaso y final', count: 4 }],
items: [
{ topic: 'Tema 1', kind: 'Examen de tema', title: 'Límites y derivadas', desc: 'Continuidad, derivabilidad y aplicaciones.', chip: an },
{ topic: 'Tema 2', kind: 'Examen de tema', title: 'Funciones', desc: 'Estudio y representación; incluye una variante.', chip: an },
{ topic: 'Tema 4', kind: 'Examen de tema', title: 'Matrices I', desc: 'Operaciones, potencias y ecuaciones matriciales.', chip: al },
{ topic: 'Tema 5', kind: 'Examen de tema', title: 'Sistemas de ecuaciones I', desc: 'Discusión con parámetros y Rouché–Frobenius.', chip: al },
{ topic: 'Tema 6', kind: 'Examen de tema', title: 'Programación lineal I', desc: 'Región factible, vértices y optimización.', chip: al },
{ topic: 'Tema 7', kind: 'Examen de tema', title: 'Probabilidad I', desc: 'Tablas de contingencia, árboles y Bayes.', chip: az },
{ topic: 'Tema 8', kind: 'Examen de tema', title: 'Distribuciones I', desc: 'Binomial, normal y aproximación.', chip: az },
{ topic: 'Tema 9', kind: 'Recuperación', title: 'Recuperación de Inferencia', desc: 'Intervalos de confianza y tamaño muestral.', chip: az }
]
};
}
}
</script>
</body>
</html>
